<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Browser FPS Game</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: monospace, sans-serif;
            user-select: none; -webkit-user-select: none;
            background-color: #0a0a1a; width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw !important; height: 100vh !important; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background-color: #00ff00;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10; display: none;
        }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center;
            color: white; font-size: 24px; cursor: pointer; z-index: 20;
        }
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            color: #00ff00; font-size: 16px; font-family: monospace;
            font-weight: bold; text-shadow: 2px 2px black; z-index: 10; display: none;
        }
        #score-dots {
            position: absolute; top: 20px; left: 20px;
            display: none; flex-direction: column; gap: 4px;
            font-family: monospace; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px black; z-index: 100; pointer-events: none;
        }
        .score-dot {
            display: inline-block; width: 12px; height: 12px;
            border-radius: 50%; margin-right: 8px; vertical-align: middle;
        }
        #match-timer {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; padding: 8px 28px;
            font-family: monospace; font-size: 28px; font-weight: bold;
            text-shadow: none; z-index: 100; pointer-events: none; display: none;
        }
        #logout-btn {
            position: absolute; top: 20px; right: 20px;
            background: #ff3333; color: white; border: none;
            padding: 8px 14px; font-weight: bold; border-radius: 5px;
            cursor: pointer; z-index: 100; font-family: monospace;
            display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #chat-container {
            position: absolute; bottom: 80px; left: 20px; width: 350px; max-height: 220px;
            display: flex; flex-direction: column; pointer-events: none; z-index: 100; font-family: monospace;
        }
        #chat-messages {
            display: flex; flex-direction: column; gap: 6px; overflow-y: auto; margin-bottom: 8px;
            text-shadow: 1px 1px 2px #000; font-size: 15px; color: white;
            max-height: 170px; min-height: 0; flex-shrink: 1;
        }
        #chat-input-wrapper {
            display: none; background: rgba(0,0,0,0.9); padding: 8px 12px; border-radius: 4px;
            border: 2px solid #333; pointer-events: auto; align-items: center; justify-content: space-between;
        }
        #chat-input {
            width: 80%; background: transparent; border: none; color: white; font-family: monospace; outline: none; font-size: 14px;
        }
        #chat-send-btn {
            background: #666; color: white; border: none; padding: 4px 8px; font-family: monospace; font-size: 12px; cursor: pointer; font-weight: bold;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            signInWithRedirect, 
            getRedirectResult, 
            GoogleAuthProvider, 
            signOut,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBeUPjB8T_kzUFX3ucPZTp9RblPlexqb2c",
            authDomain: "pointerx-fc7cb.firebaseapp.com",
            projectId: "pointerx-fc7cb",
            storageBucket: "pointerx-fc7cb.firebasestorage.app",
            messagingSenderId: "723732087608",
            appId: "1:723732087608:web:f9f46c552ebb3f988cf7cd",
            measurementId: "G-28L7SBRRC5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseAuth = auth;
        window.googleProvider = new GoogleAuthProvider();
        window.signInWithPopup = signInWithPopup;
        window.signInWithRedirect = signInWithRedirect;
        window.getRedirectResult = getRedirectResult;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>
    
    <div id="crosshair"></div>
    <div id="match-timer">10:00</div>
    <div id="score-dots">
        <div style="color: #ff3333;"><span class="score-dot" style="background: #ff3333;"></span>0</div>
        <div style="color: #00ff00;"><span class="score-dot" style="background: #00ff00;"></span>0</div>
        <div style="color: #ffcc00;"><span class="score-dot" style="background: #ffcc00;"></span>0.00</div>
    </div>
    <div id="hud">AMMO: 30 / 30</div>
    
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-wrapper">
            <input type="text" id="chat-input" placeholder="Type a message..." maxlength="100">
            <button id="chat-send-btn">SEND</button>
        </div>
    </div>

    <button id="logout-btn">LOG OUT</button>
    <div id="blocker">
        <div>Click to Start</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
